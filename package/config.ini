# EDF6 Spectator settings. Keys are Windows virtual-key codes.
# Mouse: left=0x01 right=0x02 middle=0x04  Keys: Q=0x51 E=0x45 Space=0x20 F8=0x77

# Seconds after going down before the camera jumps to a teammate.
delay=2.0

# Next / previous teammate. Your own body is the last stop of the cycle.
next=0x01
prev=0x02

# Straight back to your own body (0 = no key).
self=0

# Any connected gamepad: RB next, LB previous (1 = on, 0 = off).
gamepad=1

# Testing only: debug_key starts / stops spectating at any time, even alive, and allied NPCs
# join the cycle, so it can be tried offline. Leave it at 0 for normal play.
debug=0
debug_key=0x77
